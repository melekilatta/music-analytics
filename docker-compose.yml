services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER:?задайте PG_USER в .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?задайте PG_PASSWORD в .env}
      POSTGRES_DB: ${PG_DB:?задайте PG_DB в .env}
    ports:
      - "127.0.0.1:${PG_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  pgdata: