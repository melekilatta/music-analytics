services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=music
      - POSTGRES_PASSWORD=musicpass
      - POSTGRES_DB=music_analytics
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
volumes:
  pgdata: